version: '3.8'

services:
  redis-stack:
    image: redis/redis-stack:latest
    container_name: rtfm-redis-stack
    ports:
      - "6379:6379"    # Redis server
      - "8001:8001"    # RedisInsight (web UI for debugging)
    volumes:
      - redis_data:/data
    environment:
      - REDIS_ARGS=--save 60 1 --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  redis_data:
